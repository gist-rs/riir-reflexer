<svg xmlns="http://www.w3.org/2000/svg" id="reflexer-relation-flow-m" data-gfflow="1" viewBox="0 0 340 1046" width="340" height="1046" role="img" aria-labelledby="reflexer-relation-flow-m-t reflexer-relation-flow-m-d">
<title id="reflexer-relation-flow-m-t">Reflex and Reflexer: one question vocabulary, two engines</title>
<desc id="reflexer-relation-flow-m-d">7 steps in path order. 1. The request: a state plus typed questions — choice, score, yes-no (the shared wire; live). 2a. If a text question: State is text: the question engine reads it (reflex; live). 2b. If a game turn: State is a board: the game turn: board, piece, bag (reflexer; live). 3a. Your corpus: answers from documents you author, or abstains (reflex; live). 3b. One frozen search: the genome scores every board a move can lead to (reflexer; live). 4. If answer or abstain / place · state · survive: The envelope: one typed answer per question — or an abstain (the shared wire; live). 5. The vessel: one signed file swaps the genome whole (reflexer; live · public format). From 5 back to 3b: a different genome, whole.</desc>
<style>#reflexer-relation-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#reflexer-relation-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#reflexer-relation-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#reflexer-relation-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#reflexer-relation-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#reflexer-relation-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#reflexer-relation-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="reflexer-relation-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="1046" rx="14" fill="#11141b"/>
<g data-step="req" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="162" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="138" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">THE SHARED WIRE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">The request</text><text x="22" y="80" class="d">a state plus typed questions — choice, score,</text><text x="22" y="98" class="d">yes-no</text><rect x="22" y="110" width="184" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="124" class="el">→ 2a · a text question</text><rect x="22" y="136" width="155.2" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="150" class="el">→ 2b · a game turn</text></g>
<g data-edge="req->rxt"><path class="e" d="M44,170 V210" stroke="#69718a" marker-end="url(#reflexer-relation-flow-m-a0)"/>
<text class="el" x="56" y="194">a text question</text>
</g>
<g data-step="rxt" data-n="2a"><rect class="gf-cb" x="4" y="210" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="222" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="232" class="k" fill="#ff8a3d">REFLEX</text><circle cx="280.2" cy="228" r="3.5" fill="#4ade80"/><text x="318" y="232" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="242" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="257.5" text-anchor="middle" class="n">2a</text><text x="61.6" y="258" class="t">State is text</text><text x="22" y="282" class="d">the question engine reads it</text></g>
<g data-edge="req->rft"><path class="e" d="M44,302 V330" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="320">↳ from 1 · a game turn</text></g>
<g data-step="rft" data-n="2b"><rect class="gf-cb" x="4" y="336" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="348" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="358" class="k" fill="#ff8a3d">REFLEXER</text><circle cx="280.2" cy="354" r="3.5" fill="#4ade80"/><text x="318" y="358" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="368" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="383.5" text-anchor="middle" class="n">2b</text><text x="62.4" y="384" class="t">State is a board</text><text x="22" y="408" class="d">the game turn: board, piece, bag</text></g>
<g data-edge="rxt->rxa"><path class="e" d="M44,428 V456" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="446">↳ from 2a</text></g>
<g data-step="rxa" data-n="3a"><rect class="gf-cb" x="4" y="462" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="474" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="484" class="k" fill="#ff8a3d">REFLEX</text><circle cx="280.2" cy="480" r="3.5" fill="#4ade80"/><text x="318" y="484" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="494" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="509.5" text-anchor="middle" class="n">3a</text><text x="61.6" y="510" class="t">Your corpus</text><text x="22" y="534" class="d">answers from documents you author, or</text><text x="22" y="552" class="d">abstains</text></g>
<g data-edge="rft->rfa"><path class="e" d="M44,572 V600" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="590">↳ from 2b</text></g>
<g data-step="rfa" data-n="3b"><rect class="gf-cb" x="4" y="606" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="618" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="628" class="k" fill="#ff8a3d">REFLEXER</text><circle cx="280.2" cy="624" r="3.5" fill="#4ade80"/><text x="318" y="628" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="638" width="30.4" height="22" rx="11" fill="#ff8a3d"/><text x="37.2" y="653.5" text-anchor="middle" class="n">3b</text><text x="62.4" y="654" class="t">One frozen search</text><text x="22" y="678" class="d">the genome scores every board a move can</text><text x="22" y="696" class="d">lead to</text></g>
<g data-edge="rfa->env"><path class="e" d="M44,710 V750" stroke="#69718a" marker-end="url(#reflexer-relation-flow-m-a0)"/>
<text class="el" x="56" y="734">place · state · survive</text>
</g>
<g data-edge="rxa->env"><path class="e" d="M44,716 V744" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="734">↳ from 3a · answer or abstain</text></g>
<g data-step="env" data-n="4"><rect class="gf-cb" x="4" y="750" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="762" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="772" class="k" fill="#ff8a3d">THE SHARED WIRE</text><circle cx="280.2" cy="768" r="3.5" fill="#4ade80"/><text x="318" y="772" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="793" r="11" fill="#ff8a3d"/><text x="33" y="797.5" text-anchor="middle" class="n">4</text><text x="54" y="798" class="t">The envelope</text><text x="22" y="822" class="d">one typed answer per question — or an abstain</text></g>
<g data-step="vsl" data-n="5"><rect class="gf-cb" x="4" y="876" width="332" height="86" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="888" width="4" height="62" rx="2" fill="#ff8a3d"/><text x="22" y="898" class="k" fill="#ff8a3d">REFLEXER</text><circle cx="160.2" cy="894" r="3.5" fill="#4ade80"/><text x="318" y="898" text-anchor="end" class="s" fill="#4ade80">live · public format</text><circle cx="33" cy="919" r="11" fill="#ff8a3d"/><text x="33" y="923.5" text-anchor="middle" class="n">5</text><text x="54" y="924" class="t">The vessel</text><text x="22" y="948" class="d">one signed file swaps the genome whole</text></g>
<g data-edge="vsl->rfa"><rect x="4" y="980" width="332" height="58" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1006" class="el" style="fill:#ff8a3d">↺ from 5 back to step 3b · a different</text><text x="22" y="1024" class="el" style="fill:#ff8a3d">genome, whole</text></g>
</svg>
