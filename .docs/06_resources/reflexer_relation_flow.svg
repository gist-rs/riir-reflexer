<svg xmlns="http://www.w3.org/2000/svg" id="reflexer-relation-flow" data-gfflow="1" viewBox="0 0 1462 546" width="1462" height="546" role="img" aria-labelledby="reflexer-relation-flow-t reflexer-relation-flow-d">
<title id="reflexer-relation-flow-t">Reflex and Reflexer: one question vocabulary, two engines</title>
<desc id="reflexer-relation-flow-d">7 steps in path order. 1. The request: a state plus typed questions — choice, score, yes-no (the shared wire; live). 2a. If a text question: State is text: the question engine reads it (reflex; live). 2b. If a game turn: State is a board: the game turn: board, piece, bag (reflexer; live). 3a. Your corpus: answers from documents you author, or abstains (reflex; live). 3b. One frozen search: the genome scores every board a move can lead to (reflexer; live). 4. If answer or abstain / place · state · survive: The envelope: one typed answer per question — or an abstain (the shared wire; live). 5. The vessel: one signed file swaps the genome whole (reflexer; live · public format). From 5 back to 3b: a different genome, whole.</desc>
<style>#reflexer-relation-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#reflexer-relation-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#reflexer-relation-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#reflexer-relation-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#reflexer-relation-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#reflexer-relation-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#reflexer-relation-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#reflexer-relation-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#reflexer-relation-flow .e{fill:none;stroke-width:1.6}#reflexer-relation-flow .eb{fill:none;stroke-width:2}</style>
