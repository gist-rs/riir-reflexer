<g data-lane="rx"><rect x="10" y="190" width="1442" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#ff8a3d">REFLEX</tspan><tspan class="ln" dx="12">the question engine — free, on your machine</tspan></text></g>
<g data-lane="rf"><rect x="10" y="368" width="1442" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#ff8a3d">REFLEXER</tspan><tspan class="ln" dx="12">the rulebook engine — the arena&#x27;s rulebook boards</tspan></text></g>
